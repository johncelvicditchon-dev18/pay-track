<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pay-track</title>
    <meta
      name="description"
      content="Track institute and organization fees, balances, and official receipts at Tangub City Global College."
    />
    <link rel="icon" type="image/png" href="assets/logo-toggle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/welcome.css" />
  </head>
  <body class="home">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="TCGC PayTrack home">
          <img
            class="brand-logo"
            src="assets/logo-toggle.png"
            alt="Tangub City Global College logo"
          />
          <span class="brand-text">
            <strong>TCGC PayTrack</strong>
            <span>Payment Tracking System</span>
          </span>
        </a>

        <nav class="nav" id="primary-nav" aria-label="Primary">
          <a class="nav-student" href="pages/dashboard.html#students" aria-label="Student records">Student</a>
          <a class="nav-login" href="pages/login.html">Log in</a>
          <a class="nav-auth" href="pages/signup.html">Create account</a>
        </nav>

        <div class="header-actions" id="header-actions">
          <a class="header-login" href="pages/login.html">Log in</a>
          <a class="btn btn--light" href="pages/signup.html">Create account</a>
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="primary-nav"
            aria-label="Open menu"
          >
            <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="top">
        <div class="container">
          <div class="hero-grid">
            <div class="hero-copy">
              <h1>Every payment,<br /><span class="accent">perfectly tracked.</span></h1>

              <p class="hero-lead">
                Track institute and organization fees, balances, and official
                receipts in one place.
              </p>

              <form class="hero-track" id="track" novalidate>
                <label class="hero-track__label" for="track-student-id">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2" />
                    <path d="M7 9h4M7 13h7M15 9h2" />
                  </svg>
                  Track your payment
                </label>
                <div class="hero-track__row">
                  <input
                    class="hero-track__input"
                    type="text"
                    id="track-student-id"
                    name="studentId"
                    placeholder="Enter your Student ID"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="track-error"
                    required
                  />
                  <button class="btn btn--accent hero-track__btn" type="submit">
                    Track
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15Z" />
                    </svg>
                  </button>
                </div>
                <p class="hero-track__error" id="track-error" role="alert" hidden></p>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog class="track-dialog" id="track-dialog" aria-labelledby="track-dialog-title">
      <button
        class="track-dialog__close"
        type="button"
        id="track-close"
        aria-label="Close payment summary"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <div class="track-dialog__body" id="track-result"></div>
    </dialog>

    <script src="assets/js/ui.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/track.js"></script>
  </body>
</html>
