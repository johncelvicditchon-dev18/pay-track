<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paytrack-my-payments</title>
    <meta
      name="description"
      content="View your TCGC PayTrack balances, charges, and official receipts by semester."
    />
    <link rel="icon" type="image/png" href="../assets/logo-toggle.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/student.css" />
  </head>
  <body class="student-page">
    <header class="site-header is-scrolled" id="student-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html" aria-label="TCGC PayTrack home">
          <img
            class="brand-logo"
            src="../assets/logo-toggle.png"
            alt="Tangub City Global College logo"
          />
          <span class="brand-text student-brand-id" id="student-header-identity" hidden>
            <strong id="student-header-name">Student</strong>
            <span id="student-header-id"></span>
          </span>
        </a>

        <div class="header-actions">
          <button
            class="btn btn--outline-light btn--sm"
            type="button"
            id="student-logout"
            hidden
          >
            Log out
          </button>
        </div>
      </div>
    </header>

    <main class="container student-main">
      <section class="student-gate" id="student-gate">
        <span class="eyebrow">Student portal</span>
        <h1>Track your payments</h1>
        <p>
          Enter your Student ID to see your balances grouped by semester and
          payment type.
        </p>

        <form class="student-id-form" id="student-id-form" novalidate>
          <label for="student-id-input">Student ID</label>
          <div class="student-id-row">
            <input
              type="text"
              id="student-id-input"
              name="studentId"
              placeholder="Enter your Student ID"
              autocomplete="username"
              autocapitalize="characters"
              spellcheck="false"
              required
            />
            <button class="btn btn--primary" type="submit">View payments</button>
          </div>
          <p class="field-error" id="student-error" role="alert" hidden></p>
        </form>

        <p class="student-hint">
          Your record comes from the Finance Office. Contact them if a payment
          or receipt is missing.
        </p>
      </section>

      <section class="student-dashboard" id="student-panel" hidden>
        <div class="student-toolbar">
          <div class="student-toolbar__filters">
            <label class="student-filter" for="student-council-filter">
              <span>Council / Organization</span>
              <select id="student-council-filter">
                <option value="">All councils / orgs</option>
              </select>
            </label>
            <label class="student-filter" for="student-semester-filter">
              <span>Semester</span>
              <select id="student-semester-filter">
                <option value="">All semesters</option>
              </select>
            </label>
          </div>
          <button class="btn btn--outline student-print" type="button" id="student-print">
            Print PDF
          </button>
        </div>

        <div id="student-groups"></div>
      </section>
    </main>

    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/firebase-client.js"></script>
    <script src="../assets/js/student.js"></script>
  </body>
</html>
